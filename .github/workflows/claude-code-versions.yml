name: Claude Code versions

# Runs A9 against every Claude Code version published to npm, on three OSes, each OS and version as its own leg.
# Every leg uploads its result as an artifact, pass or fail, and those artifacts are the record of what was tested: a
# failing release never blocks later ones, a failed leg still turns the run red (GitHub's notification), and nothing is
# written back to the repo. Retry one: gh workflow run claude-code-versions.yml -f version=X.Y.Z
on:
  schedule:
    - cron: '41 */4 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Retry one version (X.Y.Z)
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: claude-code-versions
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.untested.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: untested
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].name' > "$RUNNER_TEMP/artifacts.txt"
          npm view @anthropic-ai/claude-code versions --json > "$RUNNER_TEMP/published.json"
          versions="$(node scripts/cc-versions.ts list "$RUNNER_TEMP/published.json" "$RUNNER_TEMP/artifacts.txt" "$VERSION")"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  a9:
    needs: list
    if: needs.list.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: ${{ fromJSON(needs.list.outputs.versions) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install -g "@anthropic-ai/claude-code@${{ matrix.version }}"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - if: runner.os == 'macOS'
        run: brew install tmux
      - id: e2e-tooling
        run: npm ci --prefix scripts/e2e
      - id: a9-version
        env:
          LC_ALL: ${{ runner.os == 'Linux' && 'C.UTF-8' || '' }}
        run: node scripts/e2e/run.ts --claude-version "${{ matrix.version }}"
      - name: Leg result
        if: always()
        shell: bash
        run: echo "${{ matrix.version }} ${{ matrix.os }} ${{ job.status }}" > leg.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leg-${{ matrix.version }}-${{ matrix.os }}
          path: leg.txt


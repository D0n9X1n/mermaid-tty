name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Claude Code is pinned here; version compatibility has its own workflow.
jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@users.noreply.github.com
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code@2.1.308
      # check.sh currently discovers tests/ only, not scripts/tests/ or docs specs.
      - id: node-tests
        run: node --test
      - id: typecheck
        run: node scripts/typecheck.ts
      - id: docs-tooling
        run: npm ci --prefix scripts/docs
      - id: docs-tests
        run: node --test 'scripts/tests/*.docs-spec.ts'
        env:
          GH_TOKEN: ${{ github.token }}
      - id: docs
        run: node scripts/check-docs.ts
      - id: wiki-publish-test
        shell: bash
        run: bash scripts/test-wiki-publish.sh
      - id: local-install-test
        shell: bash
        run: bash scripts/test-local-install.sh
      - id: check
        name: Must-pass suite (Git Bash on Windows; fails on any command)
        shell: bash
        run: bash scripts/check.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - id: review-hashes
        run: node scripts/check-review-hashes.ts

  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code@2.1.308
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - if: runner.os == 'macOS'
        run: brew install tmux
      - id: e2e-tooling
        name: Pinned PTY and screen tooling on every OS
        run: npm ci --prefix scripts/e2e
      - id: e2e-native
        working-directory: scripts/e2e
        run: node -e "import('node-pty').then(m => console.log('node-pty spawn:', typeof m.spawn))"
      - id: e2e-drivers
        run: node --test scripts/e2e/screen.e2etest.ts scripts/e2e/driver.e2etest.ts
      - id: e2e
        name: A9 in real Claude Code, all scenarios, themes and 256-color coverage
        env:
          LC_ALL: ${{ runner.os == 'Linux' && 'C.UTF-8' || '' }}
        run: node scripts/e2e/run.ts --claude-version 2.1.308 --scenario all

  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: gallery
        run: node scripts/render-gallery.ts gallery
      - id: gallery-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery
          path: gallery/
